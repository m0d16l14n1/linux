%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,t8140-display-power.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 and T8142 display power words

maintainers:
  - Diljit Singh <hey@djdev.me>

description:
  The words a display coprocessor's driver writes to power its domains off
  and on around a restart of its firmware, as macOS does. A display
  coprocessor names this node in its apple,display-power property. The words
  belong to the power manager and the display block, so no driver binds it.

properties:
  compatible:
    enum:
      - apple,t8140-display-power
      - apple,t8142-display-power

  reg:
    minItems: 2
    maxItems: 3

  reg-names:
    minItems: 2
    maxItems: 3

required:
  - compatible
  - reg
  - reg-names

allOf:
  - if:
      properties:
        compatible:
          const: apple,t8140-display-power
    then:
      properties:
        reg:
          items:
            - description: the display PMC word that counts the powered coprocessors
            - description: the power manager's power state words
            - description: the power manager's power gate words
        reg-names:
          items:
            - const: pmc-dcp
            - const: ps
            - const: pwrgate
  - if:
      properties:
        compatible:
          const: apple,t8142-display-power
    then:
      # T8142's PMC keeps no count of the powered coprocessors: no pmc-dcp word.
      properties:
        reg:
          items:
            - description: the power manager's power gate words
            - description: the power manager's power state words
        reg-names:
          items:
            - const: pwrgate
            - const: ps

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        display-power@3028a9c14 {
            compatible = "apple,t8140-display-power";
            reg = <0x3 0x028a9c14 0x0 0x4>,
                  <0x3 0x00700000 0x0 0x14000>,
                  <0x3 0x00724000 0x0 0x1000>;
            reg-names = "pmc-dcp", "ps", "pwrgate";
        };
    };

  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        display-power@380724000 {
            compatible = "apple,t8142-display-power";
            reg = <0x3 0x80724000 0x0 0x2000>,
                  <0x3 0x80700000 0x0 0x14000>;
            reg-names = "pwrgate", "ps";
        };
    };
